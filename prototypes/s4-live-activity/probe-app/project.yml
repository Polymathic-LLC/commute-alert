# XcodeGen spec for the S3 throwaway probe.
#
# Regenerate the project with:   xcodegen generate   (run from this directory)
# The generated S3Probe.xcodeproj is committed so a human without XcodeGen can
# just open it. If you edit sources/targets, re-run xcodegen and commit both.
name: S3Probe
options:
  bundleIdPrefix: com.polymathic.commutealert.s3probe
  deploymentTarget:
    iOS: "17.2"
  createIntermediateGroups: true
  minimumXcodeGenVersion: "2.42.0"

settings:
  base:
    DEVELOPMENT_TEAM: MSQSPT8P3W
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    # YES + an explicit INFOPLIST_FILE => Xcode merges the synthesized bundle keys
    # (CFBundleIdentifier / CFBundleExecutable / CFBundlePackageType / CFBundleName)
    # ON TOP of our file. With NO, those keys are simply absent from the built
    # .app/Info.plist and the device refuses to install it (CoreDeviceError 3000).
    # Our file still contributes NSSupportsLiveActivities, UIBackgroundModes, and
    # the widget's NSExtension dict. See FINDINGS.md F11.
    GENERATE_INFOPLIST_FILE: "YES"

targets:
  S3Probe:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
        excludes:
          - "Info.plist"
          - "S3Probe.entitlements"
      - path: Sources/Shared
    dependencies:
      - target: S3ProbeWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.polymathic.commutealert.s3probe
        INFOPLIST_FILE: Sources/App/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/App/S3Probe.entitlements
        ENABLE_PREVIEWS: "YES"

  S3ProbeWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Widget
        excludes:
          - "Info.plist"
          - "S3ProbeWidget.entitlements"
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.polymathic.commutealert.s3probe.widget
        INFOPLIST_FILE: Sources/Widget/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/Widget/S3ProbeWidget.entitlements
        ENABLE_PREVIEWS: "YES"

schemes:
  S3Probe:
    build:
      targets:
        S3Probe: all
        S3ProbeWidget: all
    run:
      config: Debug
    archive:
      config: Release
